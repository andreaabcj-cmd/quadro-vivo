<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quadro Vivo</title>
<style id="appcss">
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#e5e7eb; --ink:#1f2937; --mute:#6b7280;
  --accent:#2563eb; --accent-ink:#ffffff; --hover:#eef2ff; --field:#ffffff; --stagebg:#d9dde4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111827; --panel:#1b2433; --line:#2b3648; --ink:#e5e7eb; --mute:#9ca3af;
    --accent:#3b82f6; --hover:#223049; --field:#111827; --stagebg:#0b1020; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
  display:grid;grid-template-rows:auto 1fr;overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#f97316,#2563eb)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.grow{flex:1}
header button, .btn{border:1px solid var(--line);background:var(--field);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
header button:hover,.btn:hover{background:var(--hover)}
header button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
header button.primary{background:#16a34a;color:#fff;border-color:#16a34a;font-weight:600}
header button:disabled{opacity:.4;cursor:default}
.main{display:grid;grid-template-columns:300px 1fr 280px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#lib{border-right:1px solid var(--line);display:flex;flex-direction:column}
#insp{border-left:1px solid var(--line);padding:12px}
.search{padding:10px 10px 6px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.search input:focus,#insp input:focus,#insp select:focus,#insp textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:4px 10px 8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 10px 16px;overflow:auto;flex:1;align-content:start}
.thumb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px 4px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.thumb:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(37,99,235,.2)}
.thumb svg{width:100%;height:62px}
.thumb span{font-size:11px;line-height:1.15;text-align:center;color:#374151;min-height:26px;display:block;overflow:hidden}
.thumb.scene{grid-column:span 3;flex-direction:row;gap:10px;padding:8px 10px}
.thumb.scene svg{width:120px;height:56px;flex:none}
.thumb.scene span{text-align:left;font-size:12px;min-height:0}
.thumb svg *{animation-play-state:paused}
.thumb:hover svg *{animation-play-state:running}
.hint{color:var(--mute);padding:14px;font-size:13px;grid-column:1/-1}
#stagewrap{position:relative;display:flex;align-items:center;justify-content:center;background:var(--stagebg);min-width:0;min-height:0;overflow:hidden}
#stage{display:block;box-shadow:0 6px 30px rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-user-select:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;color:#6b7280;padding:40px}
#empty div{background:rgba(255,255,255,.88);padding:18px 24px;border-radius:14px;max-width:420px;line-height:1.5;box-shadow:0 2px 12px rgba(0,0,0,.12);color:#374151}
#empty b{color:#111827}
#hud{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(17,24,39,.88);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#hud.show{opacity:1}
body.presenting header, body.presenting #lib, body.presenting #insp{display:none}
body.presenting .main{grid-template-columns:1fr}
body.presenting{grid-template-rows:1fr}
body.presenting #stage{box-shadow:none}
body.presenting #empty{display:none}
body.presenting #stagewrap{cursor:default;background:var(--presbg,#000)}
/* inspetor */
#insp h3{margin:0 0 10px;font-size:14px}
#insp .row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
#insp label{font-size:12px;color:var(--mute)}
#insp input[type=text],#insp input[type=number],#insp select,#insp textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
#insp textarea{min-height:70px;resize:vertical}
#insp input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
#insp .inline{display:flex;gap:8px;align-items:center}
#insp .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#insp .btn{padding:5px 9px;font-size:13px}
#insp .btn.danger{color:#dc2626;border-color:#fecaca}
#insp hr{border:0;border-top:1px solid var(--line);margin:12px 0}
#insp .tips{color:var(--mute);font-size:13px;line-height:1.55}
#insp .tips kbd{background:var(--field);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}
@media (max-width:1000px){
  .main{grid-template-columns:220px 1fr}
  #insp{position:fixed;right:0;bottom:0;width:260px;max-height:50vh;border:1px solid var(--line);border-radius:12px 0 0 0;z-index:5}
}

/* ===== personagens de corpo inteiro: peças articuladas ===== */
.chr .leg-l{transform-origin:40.5px 106px}.chr .leg-r{transform-origin:59.5px 106px}
.chr .ua-l{transform-origin:25px 64px}.chr .fa-l{transform-origin:25px 94px}
.chr .ua-r{transform-origin:75px 64px}.chr .fa-r{transform-origin:75px 94px}
.chr .head{transform-origin:50px 54px}.chr .chbody{transform-origin:50px 110px}
@keyframes c-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.8px)}}
@keyframes c-sw{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes c-sw2{0%,100%{transform:rotate(-42deg)}50%{transform:rotate(42deg)}}
@keyframes c-asw{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes c-asw2{0%,100%{transform:rotate(-46deg)}50%{transform:rotate(46deg)}}
@keyframes c-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes c-bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes c-wavef{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
@keyframes c-pointf{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes c-clapl{0%,100%{transform:rotate(-122deg)}50%{transform:rotate(-142deg)}}
@keyframes c-clapr{0%,100%{transform:rotate(122deg)}50%{transform:rotate(142deg)}}
@keyframes c-shrug{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes c-jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-36px)}}
@keyframes c-tuckl{0%,100%{transform:rotate(0)}45%{transform:rotate(-16deg)}}
@keyframes c-tuckr{0%,100%{transform:rotate(0)}45%{transform:rotate(16deg)}}
@keyframes c-cheerl{0%,100%{transform:rotate(156deg)}50%{transform:rotate(172deg)}}
@keyframes c-cheerr{0%,100%{transform:rotate(-156deg)}50%{transform:rotate(-172deg)}}
@keyframes c-sway{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
@keyframes c-danl{0%,100%{transform:rotate(115deg)}50%{transform:rotate(158deg)}}
@keyframes c-danr{0%,100%{transform:rotate(-158deg)}50%{transform:rotate(-115deg)}}
@keyframes c-legd{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes c-tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes c-nod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(3deg)}}
@keyframes c-no{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
@keyframes c-look{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
.m-idle .chbody{animation:c-breathe calc(3s*var(--sp,1)) ease-in-out infinite}
.m-walk .leg-l,.m-walk .ua-r{animation:c-sw calc(1s*var(--sp,1)) ease-in-out infinite}
.m-walk .leg-r,.m-walk .ua-l{animation:c-sw calc(1s*var(--sp,1)) ease-in-out infinite;animation-delay:calc(-.5s*var(--sp,1))}
.m-walk .ua-l,.m-walk .ua-r{animation-name:c-asw}
.m-walk .chbody{animation:c-bob calc(.5s*var(--sp,1)) ease-in-out infinite}
.m-run .leg-l,.m-run .ua-r{animation:c-sw2 calc(.55s*var(--sp,1)) ease-in-out infinite}
.m-run .leg-r,.m-run .ua-l{animation:c-sw2 calc(.55s*var(--sp,1)) ease-in-out infinite;animation-delay:calc(-.275s*var(--sp,1))}
.m-run .ua-l,.m-run .ua-r{animation-name:c-asw2}
.m-run .chbody{animation:c-bob2 calc(.275s*var(--sp,1)) ease-in-out infinite}
.m-wave .chbody,.m-point .chbody,.m-think .chbody{animation:c-breathe calc(3s*var(--sp,1)) ease-in-out infinite}
.m-wave .ua-r{transform:rotate(-150deg)}
.m-wave .fa-r{animation:c-wavef calc(.6s*var(--sp,1)) ease-in-out infinite}
.m-point .ua-r{transform:rotate(-90deg)}
.m-point .fa-r{animation:c-pointf calc(1.2s*var(--sp,1)) ease-in-out infinite}
.m-think .ua-r{transform:rotate(60deg)}.m-think .fa-r{transform:rotate(120deg)}
.m-think .head{animation:c-tilt calc(3s*var(--sp,1)) ease-in-out infinite}
.m-clap .ua-l{transform:rotate(-35deg)}.m-clap .ua-r{transform:rotate(35deg)}
.m-clap .fa-l{animation:c-clapl calc(.45s*var(--sp,1)) ease-in-out infinite}
.m-clap .fa-r{animation:c-clapr calc(.45s*var(--sp,1)) ease-in-out infinite}
.m-shrug .ua-l{transform:rotate(50deg)}.m-shrug .fa-l{transform:rotate(145deg)}
.m-shrug .ua-r{transform:rotate(-50deg)}.m-shrug .fa-r{transform:rotate(-145deg)}
.m-shrug .chbody{animation:c-shrug calc(1.6s*var(--sp,1)) ease-in-out infinite}
.m-jump .chbody{animation:c-jump calc(.9s*var(--sp,1)) ease-in-out infinite}
.m-jump .ua-l{transform:rotate(30deg)}.m-jump .ua-r{transform:rotate(-30deg)}
.m-jump .leg-l{animation:c-tuckl calc(.9s*var(--sp,1)) ease-in-out infinite}
.m-jump .leg-r{animation:c-tuckr calc(.9s*var(--sp,1)) ease-in-out infinite}
.m-cheer .ua-l{animation:c-cheerl calc(.7s*var(--sp,1)) ease-in-out infinite}
.m-cheer .ua-r{animation:c-cheerr calc(.7s*var(--sp,1)) ease-in-out infinite}
.m-cheer .chbody{animation:c-bob2 calc(.7s*var(--sp,1)) ease-in-out infinite}
.m-dance .chbody{animation:c-sway calc(.9s*var(--sp,1)) ease-in-out infinite}
.m-dance .ua-l{animation:c-danl calc(.9s*var(--sp,1)) ease-in-out infinite}
.m-dance .ua-r{animation:c-danr calc(.9s*var(--sp,1)) ease-in-out infinite}
.m-dance .leg-l{animation:c-legd calc(.9s*var(--sp,1)) ease-in-out infinite}
.m-dance .leg-r{animation:c-legd calc(.9s*var(--sp,1)) ease-in-out infinite;animation-delay:calc(-.45s*var(--sp,1))}
.h-yes .head{animation:c-nod calc(.8s*var(--sp,1)) ease-in-out infinite}
.h-no .head{animation:c-no calc(.8s*var(--sp,1)) ease-in-out infinite}
.h-look .head{animation:c-look calc(3.2s*var(--sp,1)) ease-in-out infinite}
.fx-patrol{animation:k-patrol calc(5s*var(--sp,1)) ease-in-out infinite}
@keyframes k-patrol{0%,100%{transform:translateX(-150px)}50%{transform:translateX(150px)}}
.el.locked{pointer-events:none}
.cps{display:flex;gap:8px;flex-wrap:wrap}
.cp{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;color:var(--mute)}
#insp .sub{font-size:12px;font-weight:700;margin:2px 0 8px;color:var(--ink)}
#insp .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lockrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0}
.chips{max-height:120px;overflow:auto}
.el.locked *{pointer-events:none!important}
.pbar{transform-box:fill-box;transform-origin:left center;animation:pgrow calc(3s*var(--sp,1)) ease-in-out infinite alternate}
@keyframes pgrow{0%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
.imgrow{padding:0 10px 8px;display:flex;gap:6px}
.imgrow .btn{flex:1}
.thumb.char svg{height:96px}

.el[data-k="card"] .fx,.el[data-k="browser"] .fx,.el[data-k="phone"] .fx,.el[data-k="toast"] .fx,.el[data-k="post"] .fx,.el[data-k="appicon"] .fx,.el[data-k="navbar"] .fx{filter:drop-shadow(0 6px 10px rgba(15,23,42,.2))}
.el[data-k="button"] .fx,.el[data-k="prop"] .fx,.el[data-k="image"] .fx,.el[data-k="bubble"] .fx,.el[data-k="sticky"] .fx{filter:drop-shadow(0 3px 5px rgba(15,23,42,.18))}

.cr-ring{transform-box:fill-box;transform-origin:center;animation:crring 1.4s ease-out infinite}@keyframes crring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.5);opacity:0}}

#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#center #stagewrap{flex:1 1 0}
#tl{background:var(--panel);border-top:1px solid var(--line);font-size:13px;flex:none}
.tlt0{border:0;background:transparent;color:var(--ink);font-weight:600;padding:6px 12px;cursor:pointer}
.tlh{display:flex;align-items:center;gap:10px;padding:2px 12px;flex-wrap:wrap}
.tlh input[type=number]{width:52px}
.tlg{padding:0 12px;max-height:120px;overflow:auto}
.tlrow{display:grid;grid-template-columns:120px 1fr;align-items:center;min-height:26px}
.tln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;cursor:pointer;color:var(--mute)}
.tlrow.sel .tln{color:var(--accent);font-weight:700}
.tlt{position:relative;height:22px;margin:0 9px;background:linear-gradient(var(--line),var(--line)) 0 50%/100% 2px no-repeat}
.tlr{background:none}.tlr input{position:absolute;left:-9px;width:calc(100% + 18px);top:0;margin:0}
.kfd{position:absolute;top:5px;width:10px;height:10px;margin-left:-5px;background:#f59e0b;border:2px solid #fff;transform:rotate(45deg);cursor:ew-resize;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.ph{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#ef4444;pointer-events:none}
.tlf{display:flex;gap:8px;align-items:center;padding:6px 12px 8px;flex-wrap:wrap}.tlhint{color:var(--mute);font-size:12px}
.tlempty{color:var(--mute);padding:6px 0;grid-column:1/-1}
#strip{display:flex;gap:10px;padding:8px 12px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);flex:none;align-items:stretch}
.sl{position:relative;flex:none;width:128px;border:2px solid var(--line);border-radius:10px;padding:3px;cursor:pointer;background:var(--field)}
.sl.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.sl img{display:block;width:100%;aspect-ratio:16/9;border-radius:6px;background:#fff}
.sln{font-size:12px;padding:3px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sla{position:absolute;right:5px;top:5px;display:flex;gap:3px}
.sla button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 5px;cursor:pointer;font-size:12px;opacity:.92}
.slnew{flex:none;width:90px;border:2px dashed var(--line);background:transparent;border-radius:10px;cursor:pointer;color:var(--mute);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slnew span{font-size:12px}
body.presenting #tl,body.presenting #strip{display:none}

.el.xfo{pointer-events:none;animation:xfo .28s ease forwards}@keyframes xfo{to{opacity:0}}.el.xfin{animation:xfi .28s ease}@keyframes xfi{from{opacity:0}}

/* ===== MODOS: básico (minimalista) x avançado ===== */
#libtog,#more,#insptog,#catsel{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0!important;border-radius:0!important;background:transparent;padding:6px 11px;font-size:12.5px;color:var(--mute)}
.seg button.on{background:var(--accent);color:#fff}
.menuwrap{position:relative}
#moremenu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:200px;flex-direction:column;gap:2px}
#moremenu.open{display:flex}
#moremenu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--ink)}
#moremenu button:hover{background:var(--field)}
#insp details.acc{margin:0 0 8px}
#insp details.acc>summary{cursor:pointer;list-style:none;padding:2px 0}
#insp details.acc>summary::-webkit-details-marker{display:none}
#insp details.acc>summary::after{content:' ▾';color:var(--mute)}
#insp details.acc[open]>summary::after{content:' ▴'}

.m-basic #libtog,.m-basic #more,.m-basic #insptog{display:inline-flex;align-items:center;justify-content:center}
.m-basic header{gap:6px;padding:6px 10px}
.m-basic #tools .lb,.m-basic #undo .lb,.m-basic #redo .lb{display:none}
.m-basic #tools button,.m-basic #undo,.m-basic #redo,.m-basic #libtog,.m-basic #more,.m-basic #insptog{padding:6px 10px;font-size:15px;min-width:36px}
.m-basic #new,.m-basic #save,.m-basic #open,.m-basic #png,.m-basic #playpause,.m-basic header .sep.adv{display:none}
.m-basic #tl,.m-basic #strip,.m-basic .kfsec,.m-basic .advonly{display:none!important}
.m-basic .main{grid-template-columns:236px 1fr 252px}
.m-basic.nosel .main{grid-template-columns:236px 1fr 0px}
.m-basic.lib-off .main{grid-template-columns:0px 1fr 252px}
.m-basic.lib-off.nosel .main{grid-template-columns:0px 1fr 0px}
.m-basic.lib-off #lib,.m-basic.nosel #insp{display:none}
.m-basic .chips{display:none}
.m-basic #catsel{display:block;margin:0 10px 6px;width:calc(100% - 20px);padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-size:13px}
.m-basic .search{padding:8px 10px 6px}
.m-basic .grid{grid-template-columns:repeat(2,1fr);gap:6px;padding:4px 8px 12px}
.m-basic .imgrow{padding:0 10px 6px}
.m-basic .imgrow .btn{padding:6px 8px;font-size:12.5px}
.m-basic #insp{padding:10px;font-size:13px}
.m-basic #insp .sub{font-size:12.5px}
.m-basic #insptog.on,.m-basic #libtog.on{background:var(--accent);color:#fff}
body.presenting .main{grid-template-columns:1fr!important}
.m-basic .thumb.scene{grid-column:1/-1;padding:6px 8px;gap:8px}
.m-basic .thumb.scene svg{width:96px;height:48px}
.m-basic .thumb.scene span{font-size:12px}
.m-adv header{gap:4px;flex-wrap:nowrap}
.m-adv header button{padding-left:9px;padding-right:9px}
.m-adv .brand{font-size:0;gap:0}.m-adv .brand .dot{font-size:14px}
#gifmodal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
#gifmodal .gbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#gifmodal h3{margin:0 0 6px;font-size:16px}
#gifmodal .gh{margin:0 0 12px;color:var(--mute);font-size:13px}
#gifmodal label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
#gifmodal input,#gifmodal select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
#gifmodal .gbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#gifmodal .gbar{height:8px;border-radius:6px;background:var(--field);overflow:hidden;margin-top:6px}
#gifmodal .gbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.m-basic #gif{display:none}

/* ===== v7: idioma + cabeçalho ===== */
#lang{font-weight:600;white-space:nowrap}
.m-basic #lang{padding:6px 10px;font-size:14px;min-width:36px}
#tools button .ic svg{display:block}
@media (max-width:1680px){.m-adv #tools .lb{display:none}.m-adv #tools button{padding:7px 11px}}

/* ===== v8: faixa estilo Paint (modo Básico), barra sobre a peça, favoritos ===== */
#ribbon{display:none}
.m-basic{grid-template-rows:auto auto 1fr}
.m-basic #ribbon{display:flex;align-items:stretch;gap:0;padding:4px 10px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;min-height:78px}
body.presenting #ribbon{display:none!important}
#ribbon .rg{display:flex;flex-direction:column;justify-content:space-between;padding:2px 12px 3px;border-right:1px solid var(--line);flex:none}
#ribbon .rg:last-child{border-right:0}
#ribbon .rgb{display:flex;align-items:center;gap:6px;flex:1}
#ribbon .rgl{font-size:11px;color:var(--mute);text-align:center;padding-top:2px;letter-spacing:.2px}
#ribbon button,#ribbon select{border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;color:var(--ink);font-size:13px}
#ribbon button:hover,#ribbon select:hover{background:var(--hover);border-color:var(--line)}
#ribbon button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#ribbon button:disabled,#ribbon select:disabled{opacity:.4;cursor:default}
#ribbon .rbig{display:flex;flex-direction:column;align-items:center;gap:1px;width:66px;padding:5px 2px 3px}
#ribbon .rbig i{font-style:normal;font-size:23px;line-height:26px}
#ribbon .rbig span{font-size:11.5px;line-height:1.1}
#ribbon .rbig.fav i{color:#f59e0b}
.m-basic #rtools #tools{display:grid!important;grid-template-columns:repeat(4,36px);grid-auto-rows:34px;gap:2px 4px}
.m-basic #rtools #tools button{padding:0;min-width:0;width:36px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px}
#rsw{display:grid;grid-template-columns:repeat(4,22px);gap:5px}
#rsw button{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
#rsw button:hover{box-shadow:0 0 0 2px var(--accent)}
.rcust{position:relative;width:34px;height:34px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mute);font-size:20px}
.rcust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#ranim{padding:7px 8px;min-width:150px;background:var(--field);border-color:var(--line)}
.m-basic .main{grid-template-columns:236px 1fr 0px}
.m-basic.insp-pin .main{grid-template-columns:236px 1fr 262px}
.m-basic.lib-off .main{grid-template-columns:0px 1fr 0px}
.m-basic.lib-off.insp-pin .main{grid-template-columns:0px 1fr 262px}
.m-basic:not(.insp-pin) #insp{display:none}
/* barra de ajustes sobre a peça */
#ctx{position:absolute;z-index:6;display:none;align-items:center;gap:4px;padding:5px 6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.2);max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center}
#ctx select{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 4px;font-size:12.5px;max-width:132px}
#ctx button{border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;padding:4px 8px;font-size:15px;line-height:1.2;color:var(--ink)}
#ctx button:hover{background:var(--hover);border-color:var(--line)}
#ctx button.star.on{color:#f59e0b}
#ctx button.del:hover{background:#fee2e2;color:#b91c1c}
#ctx .cc{position:relative;width:30px;height:28px;border-radius:8px;border:1px solid var(--line);overflow:hidden;flex:none}
#ctx .cc input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);padding:0;border:0;cursor:pointer}
#ctx .sp{width:1px;height:20px;background:var(--line);margin:0 2px}
/* favoritos */
.thumb{position:relative}
.thumb .star{position:absolute;top:2px;right:4px;font-style:normal;font-size:16px;line-height:1;color:#cbd5e1;opacity:0;transition:opacity .12s;padding:2px;cursor:pointer}
.thumb:hover .star,.thumb .star.on{opacity:1}
.thumb .star.on{color:#f59e0b}
.thumb .star:hover{color:#f59e0b}
/* três caminhos para começar */
#empty{flex-direction:column;gap:14px}
#startpaths{display:flex;gap:10px;pointer-events:auto}
#startpaths button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:128px;padding:12px 8px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.1);color:#374151}
#startpaths button:hover{border-color:var(--accent);transform:translateY(-1px)}
#startpaths i{font-style:normal;font-size:28px;line-height:32px}
#startpaths b{font-size:13.5px;color:#111827}
#startpaths small{font-size:11.5px;color:#6b7280;line-height:1.25}
body.presenting #startpaths{display:none}
/* v8.1: mais contraste na biblioteca */
.thumb{background:#e9eef5;border:1.5px solid #94a3b8}
.thumb:hover{border-color:var(--accent);background:#dbe6f5}
.thumb svg{filter:drop-shadow(0 0 .6px rgba(15,23,42,.55))}
.thumb span{color:#0f172a;font-weight:600;font-size:12px}
.thumb .star{opacity:1;top:4px;right:4px;width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:50%;background:#fff;color:#334155;border:1.5px solid #475569;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:2}
.thumb .star:hover{background:#fef3c7;color:#d97706;border-color:#d97706;transform:scale(1.12)}
.thumb .star.on{background:#f59e0b;color:#fff;border-color:#b45309}

/* ===== animações do elemento (efeitos escolhidos pelo usuário) ===== */
.fx{transform-box:fill-box;transform-origin:center}
.fx-bounce{animation:k-bounce calc(.9s*var(--sp,1)) ease-in-out infinite}
.fx-pulse{animation:k-pulse calc(1.2s*var(--sp,1)) ease-in-out infinite}
.fx-wiggle{animation:k-wiggle calc(.8s*var(--sp,1)) ease-in-out infinite}
.fx-float{animation:k-float calc(2.6s*var(--sp,1)) ease-in-out infinite}
.fx-spin{animation:k-spin calc(4s*var(--sp,1)) linear infinite}
.fx-shake{animation:k-shake calc(.35s*var(--sp,1)) linear infinite}
.fx-blink{animation:k-blink calc(1.1s*var(--sp,1)) ease-in-out infinite}
.fx-swing{transform-origin:50% 0;animation:k-swing calc(1.8s*var(--sp,1)) ease-in-out infinite}
@keyframes k-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes k-wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes k-float{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
@keyframes k-spin{to{transform:rotate(360deg)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes k-blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes k-swing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
/* entradas (apresentação) */
.rv{transform-box:fill-box;transform-origin:center}
.en-pop{animation:e-pop .55s cubic-bezier(.2,1.5,.4,1) both}
.en-up{animation:e-up .5s ease-out both}
.en-left{animation:e-left .5s ease-out both}
.en-right{animation:e-right .5s ease-out both}
.en-fade{animation:e-fade .6s ease-out both}
.en-zoom{animation:e-zoom .5s ease-out both}
@keyframes e-pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes e-up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes e-left{from{transform:translateX(-140px);opacity:0}to{transform:none;opacity:1}}
@keyframes e-right{from{transform:translateX(140px);opacity:0}to{transform:none;opacity:1}}
@keyframes e-fade{from{opacity:0}to{opacity:1}}
@keyframes e-zoom{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
.el.hid{opacity:0;pointer-events:none}
#stage.paused *{animation-play-state:paused !important}
/* ===== animações internas dos desenhos ===== */
@keyframes eyeblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes talk{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{0%{transform:scaleY(.15)}45%,80%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
@keyframes ledblink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.14)}45%{transform:scale(1)}65%{transform:scale(1.08)}}
@keyframes ring{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
@keyframes draw{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@keyframes typebar{0%{transform:scaleX(.05)}50%,100%{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dashflow{to{stroke-dashoffset:-48}}
@keyframes antenna{0%,100%{opacity:1}50%{opacity:.1}}
@keyframes rocket{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:eyeblink 4.2s infinite}
.talk{transform-box:fill-box;transform-origin:center;animation:talk .42s ease-in-out infinite}
.i-spin{transform-origin:50px 50px;animation:spin 6s linear infinite}
.i-spin.slow{animation-duration:48s}
.i-grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3s ease-in-out infinite}
.i-grow.d2{animation-delay:.25s}.i-grow.d3{animation-delay:.5s}.i-grow.d4{animation-delay:.75s}
.i-led{animation:ledblink 1.4s infinite}
.i-led.d2{animation-delay:.4s}.i-led.d3{animation-delay:.8s}
.i-beat{transform-box:fill-box;transform-origin:center;animation:beat 1.2s infinite}
.i-ring{animation:ring 1.5s infinite}
.i-ring.d2{animation-delay:.25s}.i-ring.d3{animation-delay:.5s}
.i-draw{stroke-dasharray:100;animation:draw 3.2s ease-in-out infinite}
.i-type{transform-box:fill-box;transform-origin:left center;animation:typebar 3s ease-in-out infinite}
.i-type.d2{animation-delay:.5s}.i-type.d3{animation-delay:1s}
.i-bob{animation:bob 1.1s ease-in-out infinite}
.i-bob.d2{animation-delay:.2s}.i-bob.d3{animation-delay:.4s}.i-bob.d4{animation-delay:.6s}
.i-ant{animation:antenna 1s infinite}
.i-rocket{animation:rocket .5s ease-in-out infinite}
.flowdash{stroke-dasharray:14 10;animation:dashflow 1.4s linear infinite}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   QUADRO VIVO — um único arquivo, sem internet, sem instalação.
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const FONTS={sans:"'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif",
             hand:"'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive"};
function shade(h,f){f=f||.86;const n=parseInt(h.slice(1),16);return `rgb(${((n>>16)*f)|0},${(((n>>8)&255)*f)|0},${((n&255)*f)|0})`}

/* ---------------------------------------------------------------
   1) BIBLIOTECA DE DESENHOS (SVG)
   --------------------------------------------------------------- */
const ASSETS=[]; const AMAP={};
function A(id,cat,name,kw,vw,vh,dw,svg){const a={id,type:'asset',cat,name,kw,vw,vh,dw,svg};ASSETS.push(a);AMAP[id]=a;}

function person(o){
  o=o||{};
  const skin=o.skin||'#f1c27d', hair=o.hair||'#2d1f14', c=o.shirt||'#3b82f6', sk2=shade(skin,.85);
  if(o.plain){
    return `<path d="M6 150C6 114 28 102 60 102C92 102 114 114 114 150Z" fill="var(--c,#94a3b8)"/>
      <rect x="52" y="86" width="16" height="20" rx="6" fill="#b6c0cf"/><ellipse cx="60" cy="58" rx="29" ry="32" fill="#cbd5e1"/>`;
  }
  let s='';
  if(o.hs==='long') s+=`<path d="M27 56C22 18 98 18 93 56L99 118 21 118Z" fill="${hair}"/>`;
  const body=o.suit?'#1f2937':`var(--c,${c})`;
  s+=`<path d="M6 150C6 114 28 102 60 102C92 102 114 114 114 150Z" fill="${body}"/>`;
  if(o.suit||o.tie) s+=`<path d="M46 102L60 124L74 102Z" fill="#ffffff"/>`;
  if(o.suit) s+=`<path d="M46 102L60 124L52 150H20C20 122 32 106 46 102Z" fill="#111827" opacity=".55"/><path d="M74 102L60 124L68 150H100C100 122 88 106 74 102Z" fill="#111827" opacity=".55"/>`;
  if(o.tie) s+=`<path d="M60 118L55 127L60 148L65 127Z" fill="#dc2626"/>`;
  if(o.hoodie) s+=`<path d="M40 104Q60 122 80 104" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="5" stroke-linecap="round"/><path d="M54 116V132M66 116V132" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=`<rect x="52" y="86" width="16" height="20" rx="6" fill="${sk2}"/>`;
  s+=`<ellipse cx="60" cy="58" rx="29" ry="32" fill="${skin}"/><circle cx="31" cy="62" r="5.5" fill="${skin}"/><circle cx="89" cy="62" r="5.5" fill="${skin}"/>`;
  // cabelo
  if(o.hs==='long') s+=`<path d="M29 60C24 22 96 22 91 60C90 44 80 34 60 34C40 34 30 44 29 60Z" fill="${hair}"/>`;
  else if(o.hs==='bun') s+=`<circle cx="60" cy="20" r="11" fill="${hair}"/><path d="M30 56C27 24 93 24 90 56C87 42 78 36 60 36C42 36 33 42 30 56Z" fill="${hair}"/>`;
  else if(o.hs==='bald') s+=`<path d="M31 56C31 48 34 44 38 42C34 48 33 54 33 60Z M89 56C89 48 86 44 82 42C86 48 87 54 87 60Z" fill="${hair}"/>`;
  else s+=`<path d="M30 56C27 24 93 24 90 56C87 42 78 36 60 36C42 36 33 42 30 56Z" fill="${hair}"/>`;
  // rosto
  const m=o.mood||'neutral';

function gearPath(cx,cy,r1,r2,n){let d='';const st=Math.PI*2/n;for(let i=0;i<n;i++){const a=i*st;[[-.3,r1],[-.16,r2],[.16,r2],[.3,r1]].forEach((p,j)=>{const x=cx+Math.cos(a+p[0]*st)*p[1],y=cy+Math.sin(a+p[0]*st)*p[1];d+=(i===0&&j===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' '});}return d+'Z';}

function hex2hsl(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let hh=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60;}return[hh,s,l];}
function hsl2hex(h,s,l){h=((h%360)+360)%360;const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);const v=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(v*255).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);}
function themeHex(h,t){
  if(t==='classic')return h;const [hh,s,l]=hex2hsl(h);
  if(t==='pastel')return hsl2hex(hh,s*.62,l+(1-l)*.32);
  if(l>.7&&hh>=35&&hh<=70&&s>.5)return hsl2hex(185,1,.6);
  return hsl2hex(225+hh*.3,Math.min(.9,s*.9+.12),.05+.26*l*l*l);
}
function themeStr(str,t){if(!t||t==='classic')return str;return str.replace(/(?<![\w(&])#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})(?![0-9a-zA-Z])/g,m=>themeHex(m,t));}

  let o=`<svg x="0" y="0" width="${w}" height="${h}" viewBox="0 0 100 100" preserveAspectRatio="none" overflow="visible"><path d="${q.d}" fill="${f}"${q.fo?` fill-opacity="${q.fo}"`:''}${st}/>`;
  if(q.d2)o+=`<path d="${q.d2}" fill="none"${st}/>`;
  o+='</svg>';
  if(e.text)o+=textSVG(e,0,0,w,h,true,'#1f2937');
  return o;
}

/* texto: quebra de linha pela largura real */
const mctx=document.createElement('canvas').getContext('2d');
function wrapLines(e,w){
  mctx.font=`${e.bold?'700 ':''}${e.fs}px ${FONTS[e.font]||FONTS.sans}`;
  const out=[];
  String(e.text||'').split('\n').forEach(par=>{
    if(par===''){out.push('');return;}
    let cur='';
    par.split(' ').forEach(wd=>{const t=cur?cur+' '+wd:wd; if(!cur||mctx.measureText(t).width<=w)cur=t; else{out.push(cur);cur=wd;}});
    out.push(cur);
  });
  return out;
}
function textSVG(e,x,y,w,h,mid,col){
  const lh=e.fs*1.25, ls=wrapLines(e,w-16), tot=ls.length*lh;
  const y0=mid?y+(h-tot)/2:y+6, ax=mid?x+w/2:x+8;
  return `<text font-family="${FONTS[e.font]||FONTS.sans}" font-size="${e.fs}" font-weight="${e.bold?700:400}" fill="${col}" text-anchor="${mid?'middle':'start'}" pointer-events="none">`+
    ls.map((l,i)=>`<tspan x="${ax}" y="${+(y0+(i+.8)*lh).toFixed(1)}">${l?esc(l):'&#160;'}</tspan>`).join('')+`</text>`;
}

const ARROW_H=36;
function bodyOf(e){
  const w=e.w,h=e.h;
  switch(e.kind){
    case 'asset':{const a=AMAP[e.ref];if(!a)return '';return `<svg width="${w}" height="${h}" viewBox="0 0 ${a.vw} ${a.vh}" overflow="visible">${a.svg}</svg>`;}
    case 'text':{return textSVG(e,0,0,w,h,false,e.color||ink());}
    case 'rect':{const d=SHAPE_DEF.rect;return `<rect x="${e.sw/2}" y="${e.sw/2}" width="${w-e.sw}" height="${h-e.sw}" rx="14" fill="${e.color||d[0]}" stroke="${e.color2||d[1]}" stroke-width="${e.sw}"/>`+textSVG(e,0,0,w,h,true,'#1f2937');}
    case 'ellipse':{const d=SHAPE_DEF.ellipse;return `<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-e.sw/2}" ry="${h/2-e.sw/2}" fill="${e.color||d[0]}" stroke="${e.color2||d[1]}" stroke-width="${e.sw}"/>`+textSVG(e,0,0,w,h,true,'#1f2937');}
    case 'bubble':{const d=SHAPE_DEF.bubble,bh=h-16,r=14;
      const p=`M${r} 0H${w-r}Q${w} 0 ${w} ${r}V${bh-r}Q${w} ${bh} ${w-r} ${bh}H62L26 ${h}L36 ${bh}H${r}Q0 ${bh} 0 ${bh-r}V${r}Q0 0 ${r} 0Z`;
      return `<path d="${p}" fill="${e.color||d[0]}" stroke="${e.color2||d[1]}" stroke-width="${e.sw}" stroke-linejoin="round" transform="translate(${e.sw/2} ${e.sw/2}) scale(${(w-e.sw)/w} ${(h-e.sw)/h})"/>`+textSVG(e,0,0,w,bh,true,'#1f2937');}
    case 'poly':return polyBody(e,w,h);
    case 'sticky':{return `<rect x="5" y="7" width="${w-4}" height="${h-4}" rx="4" fill="rgba(0,0,0,.18)"/><rect x="0" y="0" width="${w-4}" height="${h-4}" rx="4" fill="${e.color||SHAPE_DEF.sticky[0]}"/>`+textSVG(e,0,0,w-4,h-4,false,'#3b2f00');}
    case 'arrow':{
      const col=e.color||ink(),sw=e.sw,hl=e.head?10+sw*2:0,hw=6+sw*1.5,cy=h/2;
      return `<line x1="6" y1="${cy}" x2="${Math.max(8,w-hl+2)}" y2="${cy}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"${e.flow?' class="flowdash"':''}/>`+
        (e.head?`<polygon points="${w-2},${cy} ${w-2-hl},${cy-hw} ${w-2-hl},${cy+hw}" fill="${col}"/>`:'');}
    case 'draw':{return `<svg width="${w}" height="${h}" viewBox="0 0 ${e.vw} ${e.vh}" overflow="visible"><path d="${e.d}" fill="none" stroke="${e.color||'#ef4444'}" stroke-width="${e.sw}" stroke-linecap="round" stroke-linejoin="round"${e.flow?' class="flowdash"':''}/></svg>`;}
  }
  return extraBody(e);
}
function elHTML(e){
  if(e.kind==='text'){const n=wrapLines(e,e.w-16).length;e.h=Math.max(e.fs*1.25+12,n*e.fs*1.25+12);}
  if(e.kind==='arrow')e.h=ARROW_H;
  const OP=(e.op!=null&&e.op<1)?` opacity="${Math.max(0,e.op)}"`:'';
  const flip=e.flip&&['asset','draw','char','image'].includes(e.kind);
  const style=(e.color&&e.kind==='asset')?`--c:${e.color};`:'';
  return `<g class="el${e.locked?' locked':''}" data-k="${e.kind==='asset'?((e.ref||'').indexOf('ic_')===0?'icon':(e.ref||'').indexOf('sc_')===0?'scen':'prop'):e.kind}" data-id="${e.id}" transform="${tf(e)}" style="${style}"><g class="rv"><g class="fx fx-${e.anim}" style="--sp:${(1/(e.spd||1)).toFixed(3)}"><rect class="hit" width="${e.w}" height="${e.h}" fill="transparent"/>`+
    (flip?`<g class="bd"${OP} transform="translate(${e.w} 0) scale(-1 1)">`:`<g class="bd"${OP}>`)+bodyOf(e)+`</g></g></g></g>`;
}
function renderBg(){
  const b=BGS[S.bg],t=S.theme||'classic',fill=themeStr(b.fill,t);
  $('#bgrect').setAttribute('fill',fill);
  $('#bggrid').setAttribute('display',b.grid?'inline':'none');$('#bggrid').style.opacity=isDark()?.14:1;
  const ba=$('#bgart'),key=S.bg+'|'+t;
  if(ba&&ba.dataset.k!==key){ba.innerHTML=b.art?themeStr(b.art(),t)+depthLayer(isDark()):'';ba.dataset.k=key;}

function drawOverlay(){
  if(present){over.innerHTML='';return;}
  const k=1/(scale||1);let h='';
  S.els.forEach(e=>{
    if(!(e.step>0))return;
    const a=e.rot*Math.PI/180,c=rot(-e.w/2,-e.h/2,a),px=e.x+e.w/2+c.x,py=e.y+e.h/2+c.y;
    h+=`<g pointer-events="none"><circle cx="${px}" cy="${py}" r="${11*k}" fill="#16a34a" stroke="#fff" stroke-width="${2*k}"/><text x="${px}" y="${py+4.5*k}" text-anchor="middle" font-size="${13*k}" font-weight="700" fill="#fff" font-family="Arial,sans-serif">${e.step}</text></g>`;
  });
  const e=sel?get(sel):null;
  if(e&&tool==='select'){
    const r=7*k,s=1.6*k;
    h+=`<g transform="${tf(e)}"><rect x="0" y="0" width="${e.w}" height="${e.h}" fill="none" stroke="#3b82f6" stroke-width="${s}" stroke-dasharray="${6*k} ${4*k}" pointer-events="none"/>`;
    [['nw',0,0,'nwse'],['ne',e.w,0,'nesw'],['se',e.w,e.h,'nwse'],['sw',0,e.h,'nesw']].forEach(c=>{
      h+=`<rect class="hdl" data-h="${c[0]}" x="${c[1]-r}" y="${c[2]-r}" width="${2*r}" height="${2*r}" rx="${2*k}" fill="#fff" stroke="#3b82f6" stroke-width="${s}" style="cursor:${c[3]}-resize"/>`;
    });
    h+=`<line x1="${e.w/2}" y1="0" x2="${e.w/2}" y2="${-28*k}" stroke="#3b82f6" stroke-width="${s}" pointer-events="none"/><circle class="hdl" data-h="rot" cx="${e.w/2}" cy="${-28*k}" r="${r*1.1}" fill="#3b82f6" stroke="#fff" stroke-width="${s}" style="cursor:grab"/></g>`;
  }
  over.innerHTML=h;
}
function select(id){sel=id;drawOverlay();renderInspector();}
function pt(ev){const p=stage.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(stage.getScreenCTM().inverse());}

let hist=[],hi=-1,saveT=null;
let snap=()=>JSON.stringify({bg:S.bg,theme:S.theme,els:S.els,next:S.next});
function commit(){
  const s=snap();
  if(hist[hi]!==s){hist=hist.slice(0,hi+1);hist.push(s);hi++;if(hist.length>150){hist.shift();hi--;}}
  updUndo();renderStripSoon();clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('quadro-vivo-v1',snap());}catch(_){if(!window.__w){window.__w=1;flash('Atenção: o salvamento automático encheu (imagens grandes). Use o botão Salvar para guardar seu quadro.',5000);}}},400);
}
let commitT=null;const commitSoon=()=>{clearTimeout(commitT);commitT=setTimeout(commit,450);};
function loadState(str){
  const o=JSON.parse(str);
  if(!o||!Array.isArray(o.els))throw new Error('formato');
  S={bg:BGS[o.bg]?o.bg:'white',theme:THEMES[o.theme]?o.theme:'classic',els:o.els.map(e=>newEl(Object.assign({},e,{id:e.id}))),next:o.next||(o.els.reduce((m,e)=>Math.max(m,e.id||0),0)+1)};
  if(sel&&!get(sel))sel=null;
  renderAll();renderInspector();
}
function undo(){if(hi>0){hi--;loadState(hist[hi]);updUndo();}}
function redo(){if(hi<hist.length-1){hi++;loadState(hist[hi]);updUndo();}}
function updUndo(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1;}

function addItem(it,cx,cy){
  if(cx==null){cx=640+(Math.random()-.5)*160;cy=340+(Math.random()-.5)*120;}
  if(it.type==='scene'){return addScene(it);}
  let e;
  if(it.type==='asset'){const w=it.dw,h=w*it.vh/it.vw;e=newEl({kind:'asset',ref:it.id,w,h,x:cx-w/2,y:cy-h/2});}
  else if(it.type==='char'){const w=it.dw,h=w*2;e=newEl({kind:'char',ch:Object.assign({},it.ch),mood:it.mood,mv:it.mv,mm:it.mm,w,h,x:cx-w/2,y:cy-h/2});}
  else{
    const w=it.w,h=it.h||ARROW_H;
    e=newEl(Object.assign({kind:it.kind,w,h,x:cx-w/2,y:cy-h/2,text:it.text||'',fs:it.fs||28,head:it.head!==false,sw:it.sw||(it.kind==='arrow'?6:4),flow:!!it.flow},pickProps(it)));
  }
  S.els.push(e);renderAll();select(e.id);commit();return e;
}
function addScene(sc){
  const items=sceneEls(sc);items.forEach(e=>{e.id=S.next++;});
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  items.forEach(e=>{if(e.kind==='text')e.h=wrapLines(e,e.w-16).length*e.fs*1.25+12;x0=Math.min(x0,e.x);y0=Math.min(y0,e.y);x1=Math.max(x1,e.x+e.w);y1=Math.max(y1,e.y+e.h);});
  const dx=640-(x0+x1)/2, dy=360-(y0+y1)/2;
  items.forEach(e=>{e.x+=dx;e.y+=dy;});
  S.els.push(...items);renderAll();select(items[items.length-1].id);commit();
  flash('Cena inserida. Cada peça já tem um "passo" para aparecer na apresentação.');
}
let hudT=null;
function flash(msg,ms){const h=$('#hud');h.textContent=msg;h.classList.add('show');clearTimeout(hudT);hudT=setTimeout(()=>h.classList.remove('show'),ms||3200);}

const CATS=['Todos','Favoritos','Personagens','Pessoas','Atendimento','Tecnologia','Negócios','Interface','Redes','Ícones','Cursor','Cenário','Símbolos','Formas','Cenas'];
let cat='Todos';
function thumbSVG(it){
  if(it.type==='char')return `<svg viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet">${charSVG(it)}</svg>`;
  if(it.type==='scene'&&it.gen)return sceneThumb(it);
  if(it.type==='asset')return `<svg viewBox="0 0 ${it.vw} ${it.vh}" preserveAspectRatio="xMidYMid meet">${it.svg}</svg>`;
  if(it.type==='scene'){const n=it.prev.length,cw=200/n;return `<svg viewBox="0 0 200 100">`+it.prev.map((id,i)=>{const a=AMAP[id],s=Math.min(cw-6,88)/Math.max(a.vw,a.vh*.0+a.vw);const w=Math.min(cw-6,90),h=w*a.vh/a.vw;return `<svg x="${i*cw+3}" y="${(100-h)/2}" width="${w}" height="${h}" viewBox="0 0 ${a.vw} ${a.vh}">${a.svg}</svg>`}).join('')+`</svg>`;}
  const e=newEl(Object.assign({kind:it.kind,w:it.w,h:it.h||ARROW_H,text:it.text||'',fs:it.fs||28,head:it.head!==false,sw:it.sw||4,flow:false},pickProps(it),{flow:false}));S.next--;
  if(it.kind==='text'){e.h=50;e.w=150;e.fs=36;}
  if(it.kind==='arrow'){e.sw=6;}
  return `<svg viewBox="-4 -4 ${e.w+8} ${e.h+8}" preserveAspectRatio="xMidYMid meet">${it.kind==='text'?textSVG(e,0,0,e.w,e.h,false,'#1f2937'):bodyOf(e)}</svg>`;
}
function renderLib(){
  const q=norm($('#q').value.trim());let items,hint='';
  if(q){const tk=q.split(/\s+/).filter(Boolean);
    items=ALL.map(it=>({it,s:tk.reduce((a,t)=>a+(it.hay.includes(t)?1:0),0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.it);
    if(/insta|face|whats|meta|tiktok|youtube|twitter|linkedin|messenger|threads|telegram|snap|pinterest|kwai/.test(q)){
      hint=`<div class="hint" style="grid-column:1/-1"><b>Logos oficiais:</b> não desenho marcas registradas. Use <b>🖼 Enviar imagem</b> (ou arraste/cole o arquivo do logo) ou estes ícones genéricos de redes sociais.</div>`;
      const soc=ALL.filter(i=>i.cat==='Redes');items=soc.concat(items.filter(i=>!soc.includes(i)));
    }
  }else items=cat==='Favoritos'?favItems():ALL.filter(it=>cat==='Todos'||it.cat===cat);
  $('#grid').innerHTML=hint+(items.length?items.map(it=>`<button class="thumb${it.type==='scene'?' scene':''}${it.type==='char'?' char':''}" draggable="true" data-lib="${it.id}" title="${esc(it.name)} — clique para inserir ou arraste"><i class="star${isFavId(it.id)?' on':''}" data-fav="${it.id}" title="Favoritar">${isFavId(it.id)?'★':'☆'}</i>${thumbSVG(it)}<span>${esc(it.name)}</span></button>`).join(''):(!q&&cat==='Favoritos')?`<div class="hint" style="grid-column:1/-1"><b>Nada favoritado ainda.</b><br>Passe o mouse sobre qualquer elemento da biblioteca e clique na ☆, ou selecione uma peça no quadro e use a ☆ da barrinha que aparece sobre ela.</div>`:`<div class="hint">Nada encontrado para “${esc($('#q').value)}”. Tente outra palavra (ex.: cliente, telefone, gráfico, seta).</div>`);
  $('#chips').innerHTML=CATS.map(c=>`<button class="chip${(!q&&c===cat)?' on':''}" data-cat="${c}">${c}</button>`).join('');
}
function addImageFile(f,cx,cy){
  if(!f||!/^image\//.test(f.type))return false;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{
      const iw=im.naturalWidth||im.width||300,ih=im.naturalHeight||im.height||300,k=Math.min(1,900/Math.max(iw,ih)),cw=Math.max(1,Math.round(iw*k)),chh=Math.max(1,Math.round(ih*k));
      const cv=document.createElement('canvas');cv.width=cw;cv.height=chh;cv.getContext('2d').drawImage(im,0,0,cw,chh);
      let src;try{src=cv.toDataURL(f.type==='image/jpeg'?'image/jpeg':'image/png',.9);}catch(_){src=r.result;}
      const dw=Math.min(280,Math.max(90,cw)),dh=dw*chh/cw,x=(cx==null?640:cx),y=(cy==null?360:cy);
      const e=newEl({kind:'image',src,w:dw,h:dh,x:x-dw/2,y:y-dh/2});S.els.push(e);renderAll();select(e.id);commit();
    };
    im.onerror=()=>flash('Não consegui abrir essa imagem.');im.src=r.result;};
  r.readAsDataURL(f);return true;
}
$('#imgbtn').onclick=()=>$('#imgfile').click();

document.addEventListener('paste',ev=>{
  if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  const its=(ev.clipboardData&&ev.clipboardData.items)||[];
  for(const it of its){if(it.kind==='file'&&/^image\//.test(it.type)){addImageFile(it.getAsFile());ev.preventDefault();return;}}
});
const libOf=id=>ALL.find(i=>i.id===id)||favC(id);
$('#grid').addEventListener('click',ev=>{const b=ev.target.closest('[data-lib]');if(!b)return;addItem(libOf(b.dataset.lib));});
$('#grid').addEventListener('dragstart',ev=>{const b=ev.target.closest('[data-lib]');if(!b)return;ev.dataTransfer.setData('text/plain',b.dataset.lib);ev.dataTransfer.effectAllowed='copy';});
$('#chips').addEventListener('click',ev=>{const b=ev.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;$('#q').value='';renderLib();});

function smooth(pts){
  if(pts.length<2)return `M${pts[0][0]} ${pts[0][1]}l.1 .1`;
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=`Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;}
  const l=pts[pts.length-1];return d+`L${l[0].toFixed(1)} ${l[1].toFixed(1)}`;
}

const PEN_COLORS={'1':'#ef4444','2':'#2563eb','3':'#16a34a','4':'#f59e0b','5':'#111827'};
document.addEventListener('keydown',ev=>{
  const tag=(ev.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  if(present){
    const k=ev.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){ev.preventDefault();nextStep();}
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){ev.preventDefault();prevStep();}

    else if(k==='p'||k==='P'){setPresentPen(!present.pen);}
    else if(k==='l'||k==='L'){setLaser(!present.laser);}
    else if(k==='c'||k==='C'){live.innerHTML='';hudPresent('Desenhos apagados');}
    else if(PEN_COLORS[k]){present.color=PEN_COLORS[k];setPresentPen(true);}

  }
  if(typing)return;

  if(mod&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return;}
  if(mod&&ev.key.toLowerCase()==='y'){ev.preventDefault();redo();return;}
  if(mod&&ev.key.toLowerCase()==='d'){ev.preventDefault();duplicate();return;}
  if(ev.key==='Delete'||ev.key==='Backspace'){if(sel){ev.preventDefault();remove();}return;}

  if(!mod){const map={v:'select',p:'pen',t:'text',a:'arrow',l:'line',r:'rect',o:'circ'};const t=map[ev.key.toLowerCase()];if(t){ev.preventDefault();setTool(t);return;}}

    if(ev.key==='ArrowLeft')e.x-=s;if(ev.key==='ArrowRight')e.x+=s;if(ev.key==='ArrowUp')e.y-=s;if(ev.key==='ArrowDown')e.y+=s;
    const n=nodeOf(e.id);if(n)n.setAttribute('transform',tf(e));drawOverlay();commitSoon();}
});

/* ---------- transição suave entre movimentos do personagem ---------- */
const BL_PARTS=['.chbody','.leg-l','.leg-r','.ua-l','.fa-l','.ua-r','.fa-r','.head'];

    const c=readTf(el);el.style.rotate=(wrap180(o.a-c.a)*(1-w)).toFixed(2)+'deg';el.style.translate=((o.x-c.x)*(1-w)).toFixed(2)+'px '+((o.y-c.y)*(1-w)).toFixed(2)+'px';});
  return w0<1&&b.n.isConnected;
}
function blendIn(id,snap){
  const n=nodeOf(id);if(!n)return;const parts=BL_PARTS.map((q,i)=>[n.querySelector(q),snap[i]]).filter(x=>x[0]&&x[1]);
  if(!parts.length)return;const b={n,parts,t0:blNow()};
  if(GIFT!=null){BLS.push(b);return;}
  (function step(now){if(stepBlend(b,now))requestAnimationFrame(step);})(b.t0);
}
const _renderEl4=renderEl;
renderEl=function(id){
  const e=get(id),n=nodeOf(id);let snap=null;
  if(e&&n&&e.kind==='char'&&!present||(e&&n&&e.kind==='char'&&present)){
    const sv=n.querySelector('svg.chr');
    if(sv){const cl=sv.getAttribute('class')||'';const nm='m-'+(e.mv||'idle'),nh='h-'+(e.hm||'none');
      if(cl.indexOf(nm)<0||cl.indexOf(nh)<0)snap=BL_PARTS.map(q=>{const el=n.querySelector(q);return el?readTf(el):null;});}
  }

  if(snap)blendIn(id,snap);
};
/* ---------- keyframes ---------- */
function swapEl(id){renderEl(id);}
const STF=['mv','hm','mm','mood','anim'];
const stOf=e=>{const o={};STF.forEach(f=>{if(e[f]!==undefined&&(f==='anim'||e.kind==='char'))o[f]=e[f];});return o;};
const SKM=new Map();

}
function poseNode(e){const n=nodeOf(e.id);if(!n)return;n.setAttribute('transform',tf(e));const b=n.querySelector('.bd');if(b){if(e.op<1)b.setAttribute('opacity',Math.max(0,e.op));else b.removeAttribute('opacity');}}
function applyTime(t){
  S.els.forEach(e=>{const p=sampleKF(e,t);if(!p)return;e.x=p.x;e.y=p.y;e.rot=p.rot;e.sc=p.sc;e.op=p.op;
    if(p.st){const key=JSON.stringify(p.st);if(SKM.get(e.id)!==key||STF.some(f=>p.st[f]!==undefined&&e[f]!==p.st[f])){SKM.set(e.id,key);Object.assign(e,p.st);swapEl(e.id);}}

  if(!present)drawOverlay();tlSync();
}
function recordKF(e,t,quiet){
  t=Math.round(t*100)/100;e.kf=e.kf||[];
  const ex=e.kf.find(k=>Math.abs(k.t-t)<.03);let rot=e.rot;
  const ref=ex?null:(e.kf.filter(k=>k.t<t).pop()||e.kf[0]);
  if(ref)rot=ref.rot+((((rot-ref.rot)%360)+540)%360)-180;
  const k={t:ex?ex.t:t,x:+e.x.toFixed(2),y:+e.y.toFixed(2),rot:+rot.toFixed(2),sc:+(e.sc||1).toFixed(3),op:+(e.op==null?1:e.op).toFixed(3),st:stOf(e)};

function delKF(e,t){if(!e.kf)return;let bi=-1,bd=.2;e.kf.forEach((k,i)=>{const d=Math.abs(k.t-t);if(d<bd){bd=d;bi=i;}});if(bi>=0)e.kf.splice(bi,1);if(!e.kf.length)e.kf=null;commit();renderTL();}

const tlHasKF=()=>S.els.some(e=>e.kf&&e.kf.length>1);
function tlStop(){TL.playing=false;cancelAnimationFrame(TL.raf);const b=$('#tlplay');if(b)b.textContent='▶';}

/* ---------- apresentação com cenas ---------- */
function cssPose(p){return `translate(${p.x}px,${p.y}px) translate(${p.w/2}px,${p.h/2}px) rotate(${p.rot}deg) scale(${p.sc||1}) translate(${-p.w/2}px,${-p.h/2}px)`;}
function goPresentScene(i,dir){

    const now={x:e.x,y:e.y,rot:e.rot,w:e.w,h:e.h,sc:e.sc||1};
    if(Math.abs(p.x-now.x)+Math.abs(p.y-now.y)+Math.abs(p.rot-now.rot)+Math.abs(p.sc-now.sc)>.5)n.animate([{transform:cssPose(p)},{transform:cssPose(now)}],{duration:850,easing:'ease-in-out'});});

    else if(T==='up')f=[{transform:'translateY(6%)',opacity:0},{transform:'none',opacity:1}];
    if(f)stage.animate(f,{duration:480,easing:'ease-out'});

function bboxOf(e){
  const a=(e.rot||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),sc=e.sc||1,cx=e.w/2,cy=e.h/2;
  const pts=[[0,0],[e.w,0],[e.w,e.h],[0,e.h]].map(([x,y])=>{const dx=(x-cx)*sc,dy=(y-cy)*sc;return[e.x+cx+dx*c-dy*s,e.y+cy+dx*s+dy*c];});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return{x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)};
}

function marqueeIds(d){

function alignSel(mode){

function distSel(axis){

const GifLib=(function(){
  function quantize(frames,w,h){
    const hist=new Uint32Array(32768),step=Math.max(1,Math.floor(w*h/40000));
    frames.forEach(f=>{const d=f.data;for(let i=0;i<w*h;i+=step){const o=i*4;hist[((d[o]>>3)<<10)|((d[o+1]>>3)<<5)|(d[o+2]>>3)]++;}});
    let bins=[];for(let k=0;k<32768;k++)if(hist[k])bins.push({k,r:(k>>10)&31,g:(k>>5)&31,b:k&31,n:hist[k]});
    let boxes=[bins];
    while(boxes.length<256){
      let bi=-1,best=-1;
      boxes.forEach((bx,i)=>{if(bx.length<2)return;let r0=31,r1=0,g0=31,g1=0,b0=31,b1=0,t=0;bx.forEach(c=>{r0=Math.min(r0,c.r);r1=Math.max(r1,c.r);g0=Math.min(g0,c.g);g1=Math.max(g1,c.g);b0=Math.min(b0,c.b);b1=Math.max(b1,c.b);t+=c.n;});
        const sc=Math.max(r1-r0,g1-g0,b1-b0)*Math.sqrt(t);if(sc>best){best=sc;bi=i;}});
      if(bi<0)break;
      const bx=boxes[bi];let r0=31,r1=0,g0=31,g1=0,b0=31,b1=0;bx.forEach(c=>{r0=Math.min(r0,c.r);r1=Math.max(r1,c.r);g0=Math.min(g0,c.g);g1=Math.max(g1,c.g);b0=Math.min(b0,c.b);b1=Math.max(b1,c.b);});
      const ax=(r1-r0>=g1-g0&&r1-r0>=b1-b0)?'r':(g1-g0>=b1-b0?'g':'b');
      bx.sort((p,q)=>p[ax]-q[ax]);let tot=0;bx.forEach(c=>tot+=c.n);let acc=0,cut=1;
      for(let i=0;i<bx.length;i++){acc+=bx[i].n;if(acc>=tot/2){cut=Math.max(1,Math.min(bx.length-1,i+1));break;}}
      boxes.splice(bi,1,bx.slice(0,cut),bx.slice(cut));
    }
    const pal=new Uint8Array(768),lut=new Int16Array(32768).fill(-1);
    boxes.forEach((bx,i)=>{let r=0,g=0,b=0,t=0;bx.forEach(c=>{r+=c.r*c.n;g+=c.g*c.n;b+=c.b*c.n;t+=c.n;});
      pal[i*3]=Math.round(r/t*8+4);pal[i*3+1]=Math.round(g/t*8+4);pal[i*3+2]=Math.round(b/t*8+4);bx.forEach(c=>lut[c.k]=i);});
    const nb=boxes.length;
    const idx=k=>{let v=lut[k];if(v>=0)return v;const r=((k>>10)&31)*8+4,g=((k>>5)&31)*8+4,b=(k&31)*8+4;let bd=1e9,bj=0;
      for(let j=0;j<nb;j++){const dr=pal[j*3]-r,dg=pal[j*3+1]-g,db=pal[j*3+2]-b,d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;bj=j;}}lut[k]=bj;return bj;};
    return{pal,idx};
  }
  function lzw(ix){
    const out=[],MIN=8,CLEAR=256,EOI=257;let bits=0,nb=0,cs=MIN+1,next=258,dict=new Map(),buf=[];
    const emit=c=>{bits|=c<<nb;nb+=cs;while(nb>=8){buf.push(bits&255);bits>>=8;nb-=8;}};
    emit(CLEAR);let pre=ix[0];
    for(let i=1;i<ix.length;i++){const k=ix[i],key=(pre<<8)|k,v=dict.get(key);
      if(v!==undefined){pre=v;continue;}
      emit(pre);
      if(next<4096){dict.set(key,next++);if(next>(1<<cs)&&cs<12)cs++;}
      else{emit(CLEAR);dict.clear();next=258;cs=MIN+1;}
      pre=k;}
    emit(pre);emit(EOI);if(nb>0)buf.push(bits&255);
    const res=[MIN];for(let i=0;i<buf.length;i+=255){const n=Math.min(255,buf.length-i);res.push(n);for(let j=0;j<n;j++)res.push(buf[i+j]);}
    res.push(0);return res;
  }
  function encode(frames,w,h,delayCs){
    const {pal,idx}=quantize(frames,w,h);const parts=[];
    parts.push(Uint8Array.from([71,73,70,56,57,97,w&255,w>>8,h&255,h>>8,0xF7,0,0]));parts.push(pal);
    parts.push(Uint8Array.from([0x21,0xFF,11,78,69,84,83,67,65,80,69,50,46,48,3,1,0,0,0]));
    frames.forEach(f=>{const d=f.data,ix=new Uint8Array(w*h);
      for(let i=0,o=0;i<w*h;i++,o+=4)ix[i]=idx(((d[o]>>3)<<10)|((d[o+1]>>3)<<5)|(d[o+2]>>3));
      parts.push(Uint8Array.from([0x21,0xF9,4,0x04,delayCs&255,delayCs>>8,0,0,0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0]));
      parts.push(Uint8Array.from(lzw(ix)));});
    parts.push(Uint8Array.from([0x3B]));
    return new Blob(parts,{type:'image/gif'});
  }
  return{encode};
})();

const GIFQ={leve:{w:560,cs:10,n:'Leve (rápido, arquivo menor)'},normal:{w:800,cs:7,n:'Normal'},alta:{w:1000,cs:5,n:'Alta (suave, arquivo maior)'}};
let gifCancel=false;
function gifUI(html){let o=$('#gifmodal');if(!o){o=document.createElement('div');o.id='gifmodal';document.body.appendChild(o);}o.innerHTML='<div class="gbox">'+html+'</div>';o.style.display='flex';return o;}

   <div class="gbtns"><button class="btn" id="gcancel">Cancelar</button><button class="btn primary" id="gstart">Gerar GIF</button></div>`);
  $('#gcancel').onclick=gifClose;
  $('#gstart').onclick=()=>gifMake(Math.max(1,Math.min(30,+$('#gdur').value||dur)),$('#gq').value);

function frameSVG(w,h,anims,css){
  const c=stage.cloneNode(true);c.querySelector('#over').innerHTML='';c.querySelector('#live').innerHTML='';const l=c.querySelector('#laser');if(l)l.remove();
  c.removeAttribute('style');c.setAttribute('width',w);c.setAttribute('height',h);
  const src=stage.querySelectorAll('#world *'),dst=c.querySelectorAll('#world *');
  const tg=new Set(anims.map(a=>a.effect&&a.effect.target).filter(Boolean));
  for(let i=0;i<src.length;i++){const el=src[i];
    if(tg.has(el)||el.style.rotate||el.style.translate){const cs=getComputedStyle(el),d=dst[i];
      d.style.transform=cs.transform;if(cs.opacity!=='1')d.style.opacity=cs.opacity;
      if(cs.rotate&&cs.rotate!=='none')d.style.rotate=cs.rotate;if(cs.translate&&cs.translate!=='none')d.style.translate=cs.translate;
      if(cs.strokeDashoffset&&cs.strokeDashoffset!=='0px'&&cs.strokeDashoffset!=='auto')d.style.strokeDashoffset=cs.strokeDashoffset;}}
  const st=document.createElementNS(NS,'style');st.textContent=css;c.insertBefore(st,c.firstChild);
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c));
}
async function gifMake(dur,q){
  const Q=GIFQ[q]||GIFQ.normal,W=Q.w,H=Math.round(W*9/16),fps=100/Q.cs,N=Math.max(2,Math.round(dur*fps));
  const css=$('#appcss').textContent+'*{animation:none!important;transition:none!important}';
  gifCancel=false;const keepSel=sel,keepSet=new Set(msel),keepT=TL.t;
  const draw=()=>gifUI(`<h3>Gerando GIF…</h3><p class="gh" id="gtxt">Preparando…</p><div class="gbar"><i id="gfill"></i></div><div class="gbtns"><button class="btn" id="gstop">Cancelar</button></div>`);
  draw();$('#gstop').onclick=()=>{gifCancel=true;};
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d',{willReadFrequently:true});
  const frames=[];let ok=true;
  try{
    sel=null;msel=new Set();drawOverlay();
    for(let i=0;i<N&&!gifCancel;i++){
      const t=i/fps;GIFT=t*1000;
      applyTime(Math.min(t,S.dur));R2.setClock(GIFT);
      const anims=document.getAnimations().filter(a=>a.effect&&a.effect.target&&stage.contains(a.effect.target));
      anims.forEach(a=>{try{a.pause();a.currentTime=GIFT;}catch(_){}});
      for(let k=BLS.length-1;k>=0;k--){if(!stepBlend(BLS[k],GIFT))BLS.splice(k,1);}
      const url=frameSVG(W,H,anims,css);
      const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
      cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.drawImage(img,0,0,W,H);
      frames.push(cx.getImageData(0,0,W,H));
      const tx=$('#gtxt'),f=$('#gfill');if(tx)tx.textContent='Quadro '+(i+1)+' de '+N;if(f)f.style.width=((i+1)/N*85)+'%';
      await new Promise(r=>setTimeout(r,0));
    }
  }catch(err){ok=false;console.error(err);}
  GIFT=null;BLS.length=0;R2.setClock(null);
  // restaura o quadro
  renderAll();TL.t=0;applyTime(0);sel=keepSel;msel=keepSet;renderAll();drawOverlay();renderInspector();
  if(gifCancel||!ok||frames.length<2){gifClose();flash(ok?'GIF cancelado.':'Não consegui gerar o GIF neste navegador.',2200);return;}
  const tx=$('#gtxt'),f=$('#gfill');if(tx)tx.textContent='Montando o arquivo GIF…';if(f)f.style.width='92%';
  await new Promise(r=>setTimeout(r,30));
  try{
    const blob=GifLib.encode(frames,W,H,Q.cs);
    download(blob,'quadro-vivo.gif');gifClose();
    flash('GIF salvo ('+(blob.size/1048576).toFixed(1)+' MB, '+frames.length+' quadros).',3200);
  }catch(err){console.error(err);gifClose();flash('Falhou ao montar o GIF.',2500);}
}

document.querySelectorAll('#startpaths [data-start]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.start;if(k==='scene')jumpCat('Cenas');else if(k==='char')jumpCat('Personagens');
  else{const t=document.querySelector('[data-tool=text]');if(t)t.click();flash('Clique no quadro para escrever.',2600);}}));
const SWC=['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed','#0d9488','#ec4899','#111827'];
$('#rsw').innerHTML=SWC.map(c=>`<button data-c="${c}" style="background:${c}" title="${c}"></button>`).join('');
function colorable(e){const k=e.kind;return k==='char'||k==='asset'||k==='text'||k==='arrow'||k==='draw'||k==='sticky'||k==='poly'||!!SHAPE_DEF[k]||k==='input'||k==='select'||(!!UIDEF[k]&&k!=='phone');}
function applyColor(v){
  const e=sel?get(sel):null;
  if(!e){flash('Clique primeiro numa peça do quadro para mudar a cor dela.',3000);return;}
  if(!colorable(e)){flash('Esta peça não tem uma cor para mudar.',2600);return;}
  ctxSet(e,e.kind==='char'?'top':'color',v);
}
$('#rsw').addEventListener('click',ev=>{const b=ev.target.closest('[data-c]');if(b)applyColor(b.dataset.c);});
$('#rcolor').addEventListener('input',ev=>applyColor(ev.target.value));
$('#rnum').onclick=()=>{let n=1;S.els.forEach(e=>{if(!e.locked)e.step=n++;});renderAll();commit();flash('Peças numeradas na ordem em que foram criadas: elas aparecem uma a uma na apresentação.',4200);};
$('#ranim').addEventListener('change',ev=>{const e=sel?get(sel):null;if(!e)return;ctxSet(e,e.kind==='char'?'mv':'anim',ev.target.value);renderInspector();});
function syncRibbon(){
  const e=sel?get(sel):null,r=$('#ranim');if(!r)return;
  r.disabled=!e;
  if(!e){r.innerHTML='<option>— escolha uma peça —</option>';}
  else if(e.kind==='char')r.innerHTML=opt(MV_OPTS,e.mv||'idle');
  else r.innerHTML=opt(ANIMS,e.anim||'none');
}
/* ---------- barra de ajustes direto na peça ---------- */
const CTX=$('#ctx');
function ctxSet(e,f,v){
  if(f==='top'){e.ch=Object.assign({},CH0,e.ch||{});e.ch.top=v;renderEl(e.id);commitSoon();}
  else if(f==='color'){e.color=v;renderEl(e.id);commitSoon();}
  else{e[f]=v;(e.kind==='char'&&['mv','hm','mm','mood'].includes(f)?swapEl:renderEl)(e.id);commitSoon();
    if(typeof STF!=='undefined'&&STF.includes(f)&&e.kf&&e.kf.length)recordKF(e,TL.t,true);}
}
const ctxOK=()=>{const e=sel?get(sel):null;return !!e&&!e.locked&&!present&&tool==='select'&&!drag&&!(typeof msel!=='undefined'&&msel.size>1);};
function ctxHTML(e){
  const k=e.kind,isCh=k==='char',S_=(f,arr,v,t)=>`<select data-cf="${f}" title="${t}">${opt(arr,v)}</select>`;
  let h='';
  if(isCh){const c=Object.assign({},CH0,e.ch||{});
    h+=S_('mv',MV_OPTS,e.mv||'idle','Movimento')+S_('mood',MOOD_OPTS,e.mood||'neutral','Expressão')+S_('mm',[['none','Boca fechada'],['talk','Falando']],e.mm||'none','Boca: fechada ou falando');
    h+=`<span class="cc" title="Cor da roupa"><input type="color" data-cf="top" value="${c.top}"></span><button data-ca="rand" title="Sortear aparência">🎲</button>`;
  }else{
    if(colorable(e))h+=`<span class="cc" title="Cor"><input type="color" data-cf="color" value="${e.color||colorDefault(e)}"></span>`;
    if(k==='text')h+=`<button data-ca="fsm" title="Letra menor">A−</button><button data-ca="fsp" title="Letra maior">A+</button>`;
    h+=S_('anim',ANIMS,e.anim||'none','Animação');
    if(['asset','draw','image'].includes(k))h+=`<button data-ca="flip" title="Espelhar">⇋</button>`;
  }
  const on=favState(e);
  h+=`<span class="sp"></span><button class="star${on?' on':''}" data-ca="fav" title="${on?'Tirar dos favoritos':'Guardar nos favoritos'}">${on?'★':'☆'}</button><button data-ca="dup" title="Duplicar">⧉</button><button class="del" data-ca="del" title="Apagar">🗑</button><button data-ca="more" title="Mais opções (painel completo)">⋯</button>`;
  return h;
}
function ctxRefresh(){
  syncRibbon();
  if(!ctxOK()){CTX.style.display='none';CTX.dataset.id='';return;}
  const e=get(sel);CTX.innerHTML=ctxHTML(e);CTX.dataset.id=sel;CTX.style.display='flex';posCtx();
}
function posCtx(){
  if(!ctxOK()){CTX.style.display='none';return;}
  if(CTX.dataset.id!=String(sel)){ctxRefresh();return;}
  CTX.style.display='flex';
  const n=nodeOf(sel),h=n&&n.querySelector('.hit');if(!h){CTX.style.display='none';return;}
  const r=h.getBoundingClientRect(),w=wrap.getBoundingClientRect(),bw=CTX.offsetWidth,bh=CTX.offsetHeight;
  let x=r.left+r.width/2-w.left-bw/2,y=r.top-w.top-bh-44;
  if(y<6)y=Math.min(r.bottom-w.top+12,w.height-bh-6);
  x=Math.max(6,Math.min(x,w.width-bw-6));
  CTX.style.left=x+'px';CTX.style.top=Math.max(4,y)+'px';
}
CTX.addEventListener('input',ev=>{const t=ev.target,f=t.dataset.cf;if(f!=='top'&&f!=='color')return;const e=get(sel);if(e)ctxSet(e,f,t.value);});
CTX.addEventListener('change',ev=>{const t=ev.target,f=t.dataset.cf;if(!f||f==='top'||f==='color')return;const e=get(sel);if(!e)return;ctxSet(e,f,t.value);renderInspector();});
CTX.addEventListener('mousedown',ev=>ev.stopPropagation());
CTX.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-ca]');if(!b)return;const a=b.dataset.ca,e=get(sel);if(!e)return;
  if(a==='del'){delSel();}
  else if(a==='dup'){duplicate();}
  else if(a==='fav'){favToggleEl(e);}
  else if(a==='flip'){e.flip=!e.flip;renderEl(e.id);commitSoon();}
  else if(a==='fsm'||a==='fsp'){e.fs=Math.max(12,Math.min(96,Math.round(e.fs*(a==='fsp'?1.15:.87))));renderEl(e.id);commitSoon();}
  else if(a==='rand'){const r=insp.querySelector('[data-act=randchar]');if(r)r.click();}
  else if(a==='more'){$('#insptog').click();}
});
const _do10=drawOverlay;drawOverlay=function(){_do10();posCtx();};
const _ri10=renderInspector;renderInspector=function(){_ri10();ctxRefresh();};
window.addEventListener('resize',()=>posCtx());
placeTools();
